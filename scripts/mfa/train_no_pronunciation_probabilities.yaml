# MFA's pronunciation-probability stages are unnecessary for the phone-as-word
# dictionary (every word has exactly one one-phone pronunciation).  This is the
# stock MFA 3.4.2 training schedule with only those two stages omitted.
training:
  - monophone:
      subset: 10000
      boost_silence: 1.25
  - triphone:
      subset: 20000
      boost_silence: 1.25
      num_leaves: 2000
      max_gaussians: 10000
  - lda:
      subset: 20000
      num_leaves: 2500
      max_gaussians: 15000
  - sat:
      subset: 20000
      num_leaves: 2500
      max_gaussians: 15000
  - sat:
      subset: 50000
      num_leaves: 4200
      max_gaussians: 40000
  - sat:
      subset: 150000
      num_leaves: 5000
      max_gaussians: 100000
  - sat:
      subset: 0
      num_leaves: 7000
      max_gaussians: 150000
      num_iterations: 20
      quick: true
      optional: true
