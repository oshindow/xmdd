experiment:
  name: qwen3_aut_kmeans_infonce_30k
  output_root: /data2/xintong/checkpoints/qwen3_aut_kmeans_infonce_30k
  seed: 42
  resume: auto

data:
  train_path: data/jsonl_actual_split/train.jsonl
  val_path: data/jsonl_actual_split/dev.jsonl
  data_root: /data2/xintong/mandarin_accent
  audio_field: l2_wav
  phone_field: actual_phones
  sample_rate: 16000
  remove_phones: [sil]

model:
  name: Qwen/Qwen3-ASR-0.6B-hf
  initialization: pretrained
  dtype: bfloat16
  freeze_conv_frontend: true
  gradient_checkpointing: true
  local_files_only: true
  projection_dim: 256

kmeans:
  clusters: 500
  features_path: /data2/xintong/checkpoints/qwen3_aut_kmeans_infonce_30k/kmeans/features.npy
  centroids_path: /data2/xintong/checkpoints/qwen3_aut_kmeans_infonce_30k/kmeans/centroids.npy
  hard_negative_map_path: /data2/xintong/checkpoints/qwen3_aut_kmeans_infonce_30k/kmeans/hard_negative_map.npy
  sample_frames: 2000000
  max_frames_per_utterance: 80
  batch_size_extract: 16
  workers_extract: 8
  hard_negative_clusters: 10
  skip_nearest: 0

contrastive:
  temperature: 0.07
  max_anchors_per_batch: 2048
  max_frames_per_utterance_train: 80
  queue_size: 32768

training:
  accelerator: gpu
  devices: 4
  strategy: ddp_find_unused_parameters_false
  precision: bf16-mixed
  per_device_batch_size: 4
  gradient_accumulation_steps: 3
  workers: 4
  max_steps: 30000
  eval_steps: 500
  logging_steps: 20
  gradient_clip_val: 1.0
  optimizer:
    name: AdamW
    learning_rate: 2.0e-5
    betas: [0.9, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler:
    name: linear
    warmup_ratio: 0.02
  checkpointing:
    monitor: val/infonce_loss
    mode: min
    filename: step={step:06d}-infonce={val/infonce_loss:.4f}
    save_top_k: 3
    save_last: true
