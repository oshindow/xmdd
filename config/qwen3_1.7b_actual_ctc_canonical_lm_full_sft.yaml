# Qwen3-ASR-1.7B joint full-parameter SFT.
# AuT CTC predicts spoken actual phones; the released Qwen3 causal LM predicts
# the intended canonical-phone string.

experiment:
  name: qwen3_asr_1.7b_actual_ctc_canonical_lm_full_sft
  output_root: /data2/xintong/checkpoints/qwen3_asr_1.7b_actual_ctc_canonical_lm_full_sft_30k_perbest
  seed: 42
  resume: auto

data:
  train_path: data/jsonl_actual_split/train.jsonl
  val_path: data/jsonl_actual_split/dev.jsonl
  data_root: /data2/xintong/mandarin_accent
  audio_field: l2_wav
  actual_phone_field: actual_phones
  canonical_phone_field: canonical_phones
  token_table_path: data/lang_jsonl/tokens.txt
  sample_rate: 16000
  remove_phones: [sil]
  canonical_target_prefix: "language Chinese<asr_text>"
  system_prompt: ""
  use_canonical_wav: false
  f0:
    enabled: false
  specaugment:
    enabled: false

model:
  name: Qwen/Qwen3-ASR-1.7B-hf
  initialization: pretrained
  full_parameter_sft: true
  dtype: bfloat16
  attention_implementation: flash_attention_2
  gradient_checkpointing: true
  use_cache: false
  audio_encoder:
    layers: 24
    hidden_size: 1024
    frozen: false
  audio_projector:
    frozen: false
  causal_lm:
    layers: 28
    hidden_size: 2048
    frozen: false
  ctc_head:
    source: audio_tower_ln_post
    architecture: linear
    input_dim: 1024
    output_dim: 188
    blank_id: 0
    zero_infinity: true
    target_field: actual_phones

loss:
  total: "canonical_lm_weight * lm_loss + actual_ctc_weight * ctc_loss"
  canonical_lm_weight: 1.0
  actual_ctc_weight: 1.0
  auxiliary_losses: []

training:
  accelerator: gpu
  devices: 4
  strategy: ddp_find_unused_parameters_false
  precision: bf16-mixed
  per_device_batch_size: 4
  gradient_accumulation_steps: 3
  effective_global_batch_size: auto
  workers: 4
  epochs: 22
  max_steps: 30000
  eval_steps: 1000
  logging_steps: 20
  gradient_clip_val: 1.0
  optimizer:
    name: AdamW
    pretrained_learning_rate: 2.0e-5
    ctc_head_learning_rate: 5.0e-5
    betas: [0.9, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler:
    name: linear
    warmup_ratio: 0.02
    decay_to_zero: true
  checkpointing:
    monitor: val/actual_per
    mode: min
    filename: "step={step:06d}-per={val/actual_per:.4f}"
    save_top_k: 3
    save_last: true

launcher:
  python: /home/xintong/miniconda3/envs/qwen3_omni/bin/python
  cuda_visible_devices: "0,1,2,3"
  flash_attention_required: true

evaluation:
  during_training:
    metrics: [total_loss, lm_loss, ctc_loss, actual_phone_per]
    ctc_decoding: greedy
  canonical_generation:
    enabled_during_training: false
    reason: avoid autoregressive generation over the full dev set every 1000 steps
  primary_checkpoint_metric: val/actual_per
