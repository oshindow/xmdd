experiment:
  name: qwen3_canonical_phone_speech_prompt_bpe_5k_2gpu
  output_root: /data2/xintong/checkpoints/qwen3_canonical_phone_speech_prompt_bpe_5k_2gpu
  seed: 42
  resume: false

data:
  train_path: data/jsonl_actual_split/train.jsonl
  val_path: data/jsonl_actual_split/dev.jsonl
  data_root: /data2/xintong/mandarin_accent
  audio_field: l2_wav
  actual_phone_field: actual_phones
  canonical_phone_field: canonical_phones
  canonical_audio_root: /data2/xintong/datasets/cosyvoice3/cosyvoice3
  canonical_log_glob: logs/*.jsonl
  token_table_path: data/lang_jsonl/tokens.txt
  sample_rate: 16000
  remove_phones: [sil]
  actual_target_prefix: "language Chinese<asr_text>"
  system_prompt: ""

model:
  name: Qwen/Qwen3-ASR-0.6B-hf
  initialization: pretrained
  dtype: bfloat16
  attention_implementation: flash_attention_2
  gradient_checkpointing: true
  use_cache: false
  local_files_only: true
  audio_encoder:
    freeze_conv_frontend: true

loss:
  lm_weight: 1.0
  l2_ctc_weight: 0.0
  canonical_ctc_weight: 0.0
  ctc_weight: 0.0
  tone_weight: 0.0
  tone_start_step: 0
  tone_ramp_steps: 1

training:
  accelerator: gpu
  devices: 2
  strategy: ddp_find_unused_parameters_false
  precision: bf16-mixed
  per_device_batch_size: 4
  gradient_accumulation_steps: 6
  workers: 4
  sampler:
    name: distributed_random
    shuffle: true
    seed: 42
    sampler_drop_last: false
    batch_drop_last: true
  max_steps: 5000
  eval_steps: 500
  logging_steps: 20
  gradient_clip_val: 1.0
  optimizer:
    name: AdamW
    learning_rate: 2.0e-5
    betas: [0.9, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler:
    name: linear
    warmup_ratio: 0.02
    decay_to_zero: true
  checkpointing:
    monitor: val/actual_per
    filename: "step={step:06d}-lmper={val/actual_per:.4f}"
    save_top_k: 3

evaluation:
  max_new_tokens: 256
